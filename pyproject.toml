[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-lakehouse"
version = "1.0.0"
authors = [
  { name="Niraj Kadam", email="2021ci29f@sigce.edu.in" },
]
description = "Production PySpark Medallion Lakehouse solving Data Skew & Small Files bottlenecks in real-time streaming pipelines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "delta-spark>=3.1.0,<3.2.0",
    "kafka-python>=2.0.2",
    "pyyaml>=6.0",
    "faker>=19.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-spark>=0.6.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
